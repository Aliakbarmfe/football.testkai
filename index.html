<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خارج از دسترس | 503 Service Unavailable</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f9fa;
            color: #202124;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* حالت تاریک خودکار اگر سیستم کاربر روی Dark Mode باشد */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #202124;
                color: #e8eaed;
            }
            .icon {
                fill: #9aa0a6 !important;
            }
            .sub-text {
                color: #9aa0a6 !important;
            }
            .footer {
                color: #9aa0a6 !important;
            }
        }

        .container {
            max-width: 600px;
            margin: 80px auto 0 auto;
            width: 100%;
        }

        /* آیکون هشدار مشابه مرورگر */
        .icon-container {
            margin-bottom: 20px;
        }

        .icon {
            width: 48px;
            height: 48px;
            fill: #5f6368;
        }

        h1 {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: #5f6368;
            margin-bottom: 12px;
        }

        .error-code {
            font-family: monospace;
            font-size: 13px;
            color: #80868b;
            margin-top: 24px;
            text-transform: uppercase;
            direction: ltr;
            text-align: right;
        }

        .footer {
            text-align: center;
            font-size: 14px;
            color: #70757a;
            direction: ltr;
            font-family: monospace;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- آیکون ارور مرورگر -->
        <div class="icon-container">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
        </div>

        <!-- پیام اصلی -->
        <h1>این صفحه موقتاً از دسترس خارج شده است</h1>
        
        <!-- توضیحات زیر عنوان -->
        <p class="sub-text">سایت مورد نظر در حال حاضر پاسخگو نیست یا زیر بار ترافیک قرار دارد. لطفاً چند دقیقه دیگر مجدداً تلاش کنید.</p>
        <p class="sub-text">در صورت تداوم مشکل، با پشتیبانی یا مدیر سرور تماس بگیرید.</p>

        <!-- کد ارور ساختگی جهت واقعی‌تر شدن -->
        <div class="error-code">ERR_TEMPORARILY_UNAVAILABLE</div>
    </div>

    <!-- فوتر با شناسه شما -->
    <div class="footer">
        Project created by: @cod_fizon
    </div>

</body>
</html>
